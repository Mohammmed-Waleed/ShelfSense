[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsense"
version = "0.1.0"
description = "Real-time product and defect detection on shelves with a fine-tuned YOLO model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shelfsense = "shelfsense.cli:main"

[tool.setuptools.packages.find]
include = ["shelfsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
